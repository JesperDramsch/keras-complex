[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "keras-complex"
maintainers = [
    {name = "Jesper Dramsch", email = "jesper@dramsch.net"}
]
description = "Complex values in Keras"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["Machine Learning", "Deep Learning", "Complex Numbers", "Keras", "TensorFlow"]
license = {file = "LICENSE.md"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Documentation :: Sphinx",
    "Natural Language :: English",
]
dependencies = [
    'tensorflow>=2.15',
    'numpy',
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
homepage = "https://github.com/JesperDramsch/keras-complex/"
documentation = "https://keras-complex.readthedocs.org"
repository = "https://github.com/JesperDramsch/keras-complex"
changelog = "https://github.com/JesperDramsch/keras-complex/releases"
bugtracker = "https://github.com/JesperDramsch/keras-complex/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

# ruff takes its target Python version from requires-python above.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# List the rules explicitly: newer ruff releases enable a much larger default set,
# and the result should not change when ruff is updated.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    # ruff format already wraps code at 88 columns. The lines it leaves long are
    # prose in strings and comments, which read better unbroken.
    "E501",
]
