name: Test Python package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # Stop on syntax errors and undefined names only.
      - run: uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # 0.2.3 shipped invalid metadata that pip 24.1 and later refuse to install.
  # Build the package and install it the way users do before any release.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel with current pip
        run: |
          uv pip install "pip>=24.1"
          python -m pip install dist/*.whl
          python -c "import complexnn"

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Keras 3, Python 3.11
            python: "3.11"
            packages: tensorflow
          - name: Keras 3, Python 3.12
            python: "3.12"
            packages: tensorflow
          - name: Keras 3, Python 3.13
            python: "3.13"
            packages: tensorflow
          # TensorFlow 2.15 is the last release with Keras 2 by default.
          - name: Keras 2 (TensorFlow 2.15), Python 3.11
            python: "3.11"
            packages: tensorflow==2.15.1
          # Newer TensorFlow can still run Keras 2 through tf-keras.
          - name: Keras 2 (tf-keras), Python 3.11
            python: "3.11"
            packages: tensorflow tf-keras
            legacy-keras: "1"
    env:
      TF_USE_LEGACY_KERAS: ${{ matrix.legacy-keras }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the tags to compute the version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e . pytest ${{ matrix.packages }}
      - name: Versions
        shell: python
        run: |
          from importlib import metadata

          for package in ("tensorflow", "keras", "tf-keras"):
              try:
                  print(package, metadata.version(package))
              except metadata.PackageNotFoundError:
                  print(package, "not installed")
      - name: Test
        run: pytest
