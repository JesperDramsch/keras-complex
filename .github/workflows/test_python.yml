name: Test Python package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # Stop on syntax errors and undefined names only.
      - run: uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Keras 3, Python 3.11
            python: "3.11"
            packages: tensorflow
          - name: Keras 3, Python 3.12
            python: "3.12"
            packages: tensorflow
          - name: Keras 3, Python 3.13
            python: "3.13"
            packages: tensorflow
          # TensorFlow 2.15 is the last release with Keras 2 by default.
          - name: Keras 2 (TensorFlow 2.15), Python 3.11
            python: "3.11"
            packages: tensorflow==2.15.1
          # Newer TensorFlow can still run Keras 2 through tf-keras.
          - name: Keras 2 (tf-keras), Python 3.11
            python: "3.11"
            packages: tensorflow tf-keras
            legacy-keras: "1"
    env:
      TF_USE_LEGACY_KERAS: ${{ matrix.legacy-keras }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the tags to compute the version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e . pytest ${{ matrix.packages }}
      - name: Versions
        run: python -c "import tensorflow as tf; print('tensorflow', tf.__version__, 'keras', getattr(tf.keras, '__version__', 'unknown'))"
      - name: Test
        run: pytest
