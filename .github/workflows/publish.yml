name: Publish to PyPI.org

# Publishing a GitHub release is the only way to upload to PyPI.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Must match the environment in the PyPI trusted publisher settings.
    environment: PyPI
    permissions:
      # Trusted publishing: PyPI accepts this job's OIDC token instead of an API token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the tags to compute the version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
